<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memcairn</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f6f5e; --accent-ink: #fff; --warn: #a3412c; --chip: #ecebe6; --hl: #fff4c2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151614; --panel: #1e1f1c; --ink: #e8e7e2; --muted: #9a9a93; --line: #31322e;
    --accent: #6fb8a2; --accent-ink: #10201b; --warn: #e2846f; --chip: #2a2b27; --hl: #3d3a22; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel);
  border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px;
  align-items: center; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: .02em; }
nav button { background: none; border: 0; padding: 6px 10px; border-radius: 6px;
  color: var(--muted); font: inherit; cursor: pointer; }
nav button.on { background: var(--chip); color: var(--ink); }
input, select, textarea, button { font: inherit; color: var(--ink); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 9px; }
textarea { width: 100%; min-height: 9em; resize: vertical; }
button.act { background: var(--accent); color: var(--accent-ink); border: 0;
  border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button.ghost { background: none; border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 12px; cursor: pointer; }
button.danger { color: var(--warn); }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.bar input[type=search] { flex: 1 1 260px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px; cursor: pointer; }
.item:hover { border-color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--chip); border-radius: 10px; padding: 0 8px; font-size: 12px; }
.chip.todo-open { background: var(--hl); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
#detail { position: fixed; inset: 0 0 0 auto; width: min(620px, 100%); background: var(--panel);
  border-left: 1px solid var(--line); z-index: 3; overflow: auto; padding: 16px;
  box-shadow: -8px 0 24px rgba(0,0,0,.12); transform: translateX(100%); transition: transform .15s; }
#detail.open { transform: none; }
#detail h2 { margin: 0 0 8px; font-size: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.grid label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); }
.hist { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 8px; font-size: 13px; }
.hist div { padding: 6px 0; border-bottom: 1px dashed var(--line); white-space: pre-wrap; }
pre { white-space: pre-wrap; background: var(--bg); padding: 10px; border-radius: 6px;
  font: 13px/1.4 ui-monospace, Consolas, monospace; overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td, th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
th { color: var(--muted); font-weight: 500; }
#gate { max-width: 420px; margin: 12vh auto; background: var(--panel); padding: 20px;
  border: 1px solid var(--line); border-radius: 10px; }
#gate input { width: 100%; margin: 10px 0; }
.msg { color: var(--warn); font-size: 14px; min-height: 1.2em; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card .n { font-size: 26px; font-weight: 600; line-height: 1.1; }
.card .l { color: var(--muted); font-size: 13px; }
.card.click { cursor: pointer; } .card.click:hover { border-color: var(--accent); }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.panel h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
.bar-row { display: grid; grid-template-columns: 120px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 8px; border-radius: 4px; background: var(--accent); opacity: .8; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
.spark div { flex: 1; background: var(--accent); opacity: .75; border-radius: 3px 3px 0 0; min-height: 2px; }
.spark-l { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 4px; }
.mini { font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; align-items: baseline; }
.mini:last-child { border-bottom: 0; }
.mini .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.linkish { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0 4px; font: inherit; font-size: 12px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header h1 { width: 100%; } .bar-row { grid-template-columns: 90px 1fr 36px; } }
</style>
</head>
<body>
<div id="gate" hidden>
  <h1 style="margin-top:0">Memcairn</h1>
  <p>Enter a client token (<code>memcairn token add &lt;name&gt;</code>). It stays in this
  browser tab only, unless you tick the box.</p>
  <input id="tok" type="password" placeholder="mcn_…" autocomplete="off">
  <label><input id="keep" type="checkbox"> remember on this device</label>
  <div class="row"><button class="act" id="enter">Open</button></div>
  <div class="msg" id="gatemsg"></div>
</div>

<div id="app" hidden>
<header>
  <h1>Memcairn</h1>
  <nav>
    <button data-tab="overview" class="on">Overview</button>
    <button data-tab="memory">Memory</button>
    <button data-tab="docs">Documents</button>
    <button data-tab="review">Review</button>
    <button data-tab="stats">Stats</button>
  </nav>
  <span style="flex:1"></span>
  <span class="meta" id="who"></span>
  <button class="ghost" id="logout">Sign out</button>
</header>
<main>
  <section data-pane="overview"><div id="overview"><div class="empty">Loading…</div></div></section>
  <section data-pane="memory" hidden>
    <div class="bar">
      <input type="search" id="q" placeholder="Search memory (words, a question, 'last week'…)">
      <select id="ftype"><option value="">all types</option></select>
      <input id="fent" list="ents" placeholder="entity">
      <datalist id="ents"></datalist>
      <select id="fstatus"><option value="">any status</option><option>open</option>
        <option>done</option><option>dropped</option></select>
      <label class="meta"><input type="checkbox" id="deep"> deep</label>
      <button class="ghost" id="new">+ New</button>
    </div>
    <div class="meta" id="count"></div>
    <div class="list" id="results"></div>
  </section>
  <section data-pane="docs" hidden><div class="list" id="doclist"></div><div id="docview"></div></section>
  <section data-pane="review" hidden><div id="reviewlist"></div></section>
  <section data-pane="stats" hidden><div id="statsview"></div></section>
</main>
</div>

<aside id="detail"></aside>

<script>
const TYPES = ["fact", "project", "feedback", "reference", "decision", "todo", "howto", "user"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get() { try { return sessionStorage.getItem("mc_tok") || localStorage.getItem("mc_tok"); } catch { return null; } },
  set(t, keep) { try { sessionStorage.setItem("mc_tok", t); if (keep) localStorage.setItem("mc_tok", t); } catch {} },
  clear() { try { sessionStorage.removeItem("mc_tok"); localStorage.removeItem("mc_tok"); } catch {} },
};
let token = store.get();

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Authorization": "Bearer " + token,
    "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (res.status === 401) { store.clear(); token = null; showGate("Token not accepted."); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function showGate(msg = "") { $("#app").hidden = true; $("#gate").hidden = false; $("#gatemsg").textContent = msg; $("#tok").focus(); }
async function start() {
  $("#gate").hidden = true; $("#app").hidden = false;
  try {
    const s = await api("/api/stats");
    $("#who").textContent = `as ${s.client || "?"} · ${s.stats.memories} memories`;
  } catch { return; }
  TYPES.forEach(t => $("#ftype").insertAdjacentHTML("beforeend", `<option>${t}</option>`));
  loadEntities();
  loadOverview();
}
const loadEntities = () => api("/api/entities").then(es => $("#ents").innerHTML = es.map(e => `<option value="${esc(e.name)}">${e.facts}</option>`).join(""));

function showTab(tab) {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
  document.querySelectorAll("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== tab);
}
function filterEntity(name) { showTab("memory"); $("#q").value = ""; $("#fent").value = name; search(); }
function filterTodos() { showTab("memory"); $("#q").value = ""; $("#fent").value = ""; $("#ftype").value = "todo"; $("#fstatus").value = "open"; search(); }

async function setStatus(id, status) {
  const m = (await api(`/api/memory/${id}`)).memory;
  await api(`/api/memory/${id}`, { method: "POST", body: JSON.stringify({ status, expected_version: m.version }) });
}

async function renameEntity(name) {
  const to = prompt(`Rename entity "${name}" to (an existing name merges them):`, name);
  if (!to || to === name) return;
  const r = await api("/api/entity/rename", { method: "POST", body: JSON.stringify({ from: name, to }) });
  alert(`${r.moved} facts moved to "${to}".`); loadEntities(); loadOverview();
}

function ago(ts) {
  if (!ts) return "never";
  const s = (Date.now() - Date.parse(ts.endsWith("Z") ? ts : ts + "Z")) / 1000;
  if (s < 90) return "just now"; if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " days ago";
}

async function loadOverview() {
  const o = await api("/api/overview");
  const st = o.stats;
  api("/api/review").then(review => {  // slower (similarity pairs): fill in when ready
    const el = $("#rvcard"); if (!el) return;
    el.innerHTML = `<div class="n">${review.length}</div><div class="l">to clean up · ~${review.reduce((a, i) => a + i.saving, 0)} tok</div>`;
  }).catch(() => {});
  const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); days.push(d); }
  const per = Object.fromEntries(o.activity.map(a => [a.day, a.n])), maxDay = Math.max(1, ...days.map(d => per[d] || 0));
  const maxType = Math.max(1, ...Object.values(o.types)), maxEnt = Math.max(1, ...o.top_entities.map(e => e.facts));
  const u = o.usage, recall = u.recall || {}, hook = u["session-hook"] || {};
  const calls = Object.values(u).reduce((a, x) => a + x.calls, 0);
  $("#overview").innerHTML = `
  <div class="cards">
    <div class="card click" data-go="memory"><div class="n">${st.memories}</div><div class="l">facts</div></div>
    <div class="card"><div class="n">${st.entities}</div><div class="l">entities</div></div>
    <div class="card click" data-go="todos"><div class="n">${o.open_todos}</div><div class="l">open todos</div></div>
    <div class="card click" data-go="docs"><div class="n">${o.documents.count}</div><div class="l">documents · ${o.documents.chars < 1000 ? o.documents.chars + " chars" : Math.round(o.documents.chars / 1000) + "k chars"}</div></div>
    <div class="card click" data-go="review" id="rvcard"><div class="n">…</div><div class="l">to clean up</div></div>
    <div class="card"><div class="n">${st.superseded + st.forgotten}</div><div class="l">in history (replaced/forgotten)</div></div>
  </div>
  <div class="panels">
    <div class="panel"><h3>Changes, last 14 days</h3>
      <div class="spark">${days.map(d => `<div title="${d}: ${per[d] || 0}" style="height:${100 * (per[d] || 0) / maxDay}%"></div>`).join("")}</div>
      <div class="spark-l"><span>${days[0].slice(5)}</span><span>${days.reduce((a, d) => a + (per[d] || 0), 0)} writes</span><span>today</span></div></div>
    <div class="panel"><h3>How agents use it, last 7 days</h3>
      <div class="mini"><span class="t">tool calls</span><b>${calls}</b></div>
      <div class="mini"><span class="t">recall: calls · avg tokens · empty</span><b>${recall.calls || 0} · ${recall.avg_tokens || 0} · ${recall.empty || 0}</b></div>
      <div class="mini"><span class="t">sessions started (overview injected)</span><b>${hook.calls || 0}</b></div>
      <div class="mini"><span class="t">facts written</span><b>${(u.remember || {}).calls || 0}</b></div></div>
    <div class="panel"><h3>Machines and clients</h3>${o.clients.map(c => `<div class="mini"><span class="t">${esc(c.name)}</span><span class="meta">${ago(c.last_seen_at)} · ${c.writes_30d} writes/30d</span></div>`).join("")}</div>
    <div class="panel"><h3>Types</h3>${Object.entries(o.types).map(([t, n]) => `<div class="bar-row"><span class="name">${esc(t)}</span><div class="bar" style="width:${100 * n / maxType}%"></div><span>${n}</span></div>`).join("")}</div>
    <div class="panel"><h3>Biggest topics</h3>${o.top_entities.map(e => `<div class="bar-row"><span class="name" title="${esc(e.name)}"><button class="linkish" data-ent="${esc(e.name)}" style="padding:0">${esc(e.name)}</button></span><div class="bar" style="width:${100 * e.facts / maxEnt}%"></div><span>${e.facts} <button class="linkish" data-rename="${esc(e.name)}" title="rename or merge">✎</button></span></div>`).join("")}</div>
    <div class="panel"><h3>Open todos <button class="linkish" data-go="todos">all ${o.open_todos}</button></h3>${o.todos.map(t => `<div class="mini"><span class="t" data-id="${t.id}" title="${esc(t.content)}">${esc(t.content)}</span><button class="linkish" data-done="${t.id}">done</button><button class="linkish" data-drop="${t.id}">drop</button></div>`).join("") || '<div class="meta">none</div>'}</div>
    <div class="panel"><h3>Recently changed</h3>${o.recent.map(m => `<div class="mini"><span class="chip">${esc(m.type)}</span><span class="t" data-id="${m.id}" title="${esc(m.content)}">${esc(m.content)}</span><span class="meta">${ago(m.updated_at)}</span></div>`).join("")}</div>
  </div>`;
}

$("#overview").onclick = async e => {
  const t = e.target.closest("[data-go],[data-ent],[data-rename],[data-done],[data-drop],[data-id]"); if (!t) return;
  const d = t.dataset;
  try {
    if (d.go === "memory") { showTab("memory"); search(); }
    else if (d.go === "todos") filterTodos();
    else if (d.go) { showTab(d.go); ({ docs: loadDocs, review: loadReview })[d.go](); }
    else if (d.ent) filterEntity(d.ent);
    else if (d.rename) await renameEntity(d.rename);
    else if (d.done || d.drop) { await setStatus(+(d.done || d.drop), d.done ? "done" : "dropped"); loadOverview(); }
    else if (d.id) openMemory(+d.id);
  } catch (err) { alert(err.message); }
};

$("#enter").onclick = () => { token = $("#tok").value.trim(); if (!token) return; store.set(token, $("#keep").checked); start(); };
$("#tok").onkeydown = e => { if (e.key === "Enter") $("#enter").click(); };
$("#logout").onclick = () => { store.clear(); token = null; showGate(); };

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  showTab(b.dataset.tab);
  ({ overview: loadOverview, memory: search, docs: loadDocs, review: loadReview, stats: loadStats })[b.dataset.tab]?.();
});

let timer;
["#q", "#fent"].forEach(s => $(s).oninput = () => { clearTimeout(timer); timer = setTimeout(search, 250); });
["#ftype", "#fstatus", "#deep"].forEach(s => $(s).onchange = search);

function chips(m) {
  const st = m.status ? `<span class="chip ${m.type === "todo" && m.status === "open" ? "todo-open" : ""}">${esc(m.status)}</span>` : "";
  return `<span class="chip">m${m.id}</span><span class="chip">${esc(m.type)}</span>` +
    (m.entity_name ? `<span>${esc(m.entity_name)}</span>` : "") + st +
    (m.pinned ? `<span class="chip">pinned</span>` : "") +
    `<span>${esc((m.updated_at || m.recorded_at || "").slice(0, 10))}</span>` +
    (m.client ? `<span>by ${esc(m.client)}</span>` : "");
}

async function search() {
  const p = new URLSearchParams({ q: $("#q").value, type: $("#ftype").value, entity: $("#fent").value,
    status: $("#fstatus").value, deep: $("#deep").checked ? "1" : "0", limit: "60" });
  try {
    const r = await api("/api/search?" + p);
    const parts = (r.parts || []).map(c => `<div class="item" data-doc="${esc(c.doc)}" data-anchor="${esc(c.anchor)}">
      <div class="meta"><span class="chip">doc</span><span>${esc(c.doc)}</span><span>${esc(c.path)}</span></div>
      <div>${esc(c.content.slice(0, 300))}</div></div>`).join("");
    const items = r.items.map(m => `<div class="item" data-id="${m.id}"><div class="meta">${chips(m)}</div>
      <div>${esc(m.content)}</div></div>`).join("");
    $("#count").textContent = $("#q").value ? `${r.items.length} facts${r.parts?.length ? `, ${r.parts.length} document parts` : ""}${r.coverage < .5 ? " · low confidence" : ""}` : "most recently changed";
    $("#results").innerHTML = parts + items || `<div class="empty">Nothing found${$("#deep").checked ? "" : " — try deep"}.</div>`;
  } catch (e) { $("#results").innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
}

$("#results").onclick = e => {
  const it = e.target.closest(".item"); if (!it) return;
  if (it.dataset.id) openMemory(+it.dataset.id);
  else openDocPart(it.dataset.doc, it.dataset.anchor);
};

function close() { $("#detail").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

async function openMemory(id) {
  const d = await api(`/api/memory/${id}`); const m = d.memory;
  const opts = TYPES.map(t => `<option ${t === m.type ? "selected" : ""}>${t}</option>`).join("");
  const gone = !!m.deleted_at, old = !!m.superseded_by;
  $("#detail").innerHTML = `
    <div class="row" style="justify-content:space-between;margin:0"><h2>m${m.id} · v${m.version}</h2>
      <button class="ghost" id="x">Close</button></div>
    <div class="meta">${chips(m)}${gone ? '<span class="chip">forgotten</span>' : ""}${old ? `<span class="chip">replaced by m${m.superseded_by}</span>` : ""}</div>
    <textarea id="content">${esc(m.content)}</textarea>
    <div class="grid">
      <label>type<select id="type">${opts}</select></label>
      <label>entity<input id="entity" value="${esc(m.entity_name || "")}" list="ents"></label>
      <label>status<select id="status"><option value="">—</option>${["open","done","dropped"].map(s => `<option ${s === m.status ? "selected" : ""}>${s}</option>`).join("")}</select></label>
      <label>pinned<select id="pinned"><option value="0">no</option><option value="1" ${m.pinned ? "selected" : ""}>yes</option></select></label>
    </div>
    <div class="row">
      <button class="act" id="save">Save (edit)</button>
      <button class="ghost" id="supersede" title="the fact changed in reality: keep the old one as history">Save as new version</button>
      ${m.type === "todo" && m.status === "open" ? '<button class="ghost" id="done">Mark done</button>' : ""}
      <button class="ghost danger" id="forget" title="hide it; can be restored">${gone ? "Restore" : "Forget"}</button>
      <button class="ghost danger" id="purge" title="delete with all versions; cannot be undone">Delete permanently</button>
    </div>
    <div class="msg" id="dmsg"></div>
    <div class="hist"><b>History</b>${d.history.map(h => `<div><span class="meta">v${h.version} · ${esc(h.at.slice(0,16))} · ${esc(h.op)} · by ${esc(h.by || "-")}</span>\n${esc(h.content)}</div>`).join("")}
    ${d.replaced.length ? `<b>Replaced earlier facts</b>${d.replaced.map(r => `<div><span class="meta">m${r.id} · ${esc(r.recorded_at.slice(0,10))}</span>\n${esc(r.content)}</div>`).join("")}` : ""}</div>`;
  $("#detail").classList.add("open");
  $("#x").onclick = close;
  const body = supersede => {
    const b = { content: $("#content").value, type: $("#type").value, entity: $("#entity").value || null,
      pinned: $("#pinned").value === "1", expected_version: m.version, supersede };
    if ($("#status").value) b.status = $("#status").value;
    return JSON.stringify(b);
  };
  const run = async f => { try { await f(); search(); } catch (e) { $("#dmsg").textContent = e.message; } };
  $("#save").onclick = () => run(async () => { const r = await api(`/api/memory/${id}`, { method: "POST", body: body(false) }); openMemory(r.memory.id); });
  $("#supersede").onclick = () => run(async () => { const r = await api(`/api/memory/${id}`, { method: "POST", body: body(true) }); openMemory(r.memory.id); });
  $("#forget").onclick = () => run(async () => {
    if (!gone && !confirm(`Forget m${id}? (it can be restored)`)) return;
    await api(`/api/memory/${id}/forget`, { method: "POST", body: JSON.stringify({ undo: gone }) }); openMemory(id);
  });
  if ($("#done")) $("#done").onclick = () => run(async () => { await setStatus(id, "done"); openMemory(id); });
  $("#purge").onclick = () => run(async () => {
    const typed = prompt(`Delete m${id} permanently, with all its versions and the facts it replaced? This cannot be undone.\nType m${id} to confirm:`);
    if (typed !== `m${id}`) return;
    const r = await api(`/api/memory/${id}/delete`, { method: "POST", body: JSON.stringify({ confirm: `m${id}` }) });
    close(); alert(`Deleted ${r.deleted} row(s).`); loadEntities();
  });
}

$("#new").onclick = () => {
  $("#detail").innerHTML = `<div class="row" style="justify-content:space-between;margin:0"><h2>New fact</h2><button class="ghost" id="x">Close</button></div>
    <p class="meta">One short atomic fact. No passwords or tokens (the server refuses them).</p>
    <textarea id="content"></textarea>
    <div class="grid"><label>type<select id="type">${TYPES.map(t => `<option>${t}</option>`).join("")}</select></label>
      <label>entity<input id="entity" list="ents"></label></div>
    <div class="row"><button class="act" id="save">Save</button></div><div class="msg" id="dmsg"></div>`;
  $("#detail").classList.add("open"); $("#x").onclick = close; $("#content").focus();
  $("#save").onclick = async () => {
    try {
      const r = await api("/api/memory", { method: "POST", body: JSON.stringify({ content: $("#content").value, type: $("#type").value, entity: $("#entity").value }) });
      search(); openMemory(r.memory.id);
      if (r.duplicates.length) setTimeout(() => $("#dmsg").textContent = "Possible duplicates: " + r.duplicates.map(i => "m" + i).join(", "), 50);
    } catch (e) { $("#dmsg").textContent = e.message; }
  };
};

async function loadDocs() {
  const ds = await api("/api/docs");
  $("#doclist").innerHTML = ds.map(d => `<div class="item" data-doc="${esc(d.name)}"><div class="meta"><span class="chip">v${d.version}</span>
    <span>${d.size} chars</span><span>${esc(d.updated_at.slice(0,10))}</span><span>by ${esc(d.client || "-")}</span></div><b>${esc(d.name)}</b></div>`).join("") || `<div class="empty">No shared documents.</div>`;
  $("#doclist").onclick = e => { const it = e.target.closest(".item"); if (it) openDocPart(it.dataset.doc); };
}

async function openDocPart(name, anchor) {
  const res = await fetch(`/docs/${encodeURIComponent(name)}`, { headers: { "Authorization": "Bearer " + token } });
  const d = await res.json();
  $("#detail").innerHTML = `<div class="row" style="justify-content:space-between;margin:0"><h2>${esc(name)} · v${d.version}</h2><button class="ghost" id="x">Close</button></div>
    <p class="meta">Saving creates version ${d.version + 1}; machines that sync this document get it at their next session start or end.</p>
    <textarea id="doctext" spellcheck="false" style="min-height:60vh;font:13px/1.4 ui-monospace,Consolas,monospace">${esc(d.content)}</textarea>
    <div class="row"><button class="act" id="docsave">Save</button></div><div class="msg" id="dmsg"></div>`;
  $("#detail").classList.add("open"); $("#x").onclick = close;
  if (anchor) {  // jump to the part that was found
    const ta = $("#doctext"), probe = (anchor.split("-")[0] || "").toLowerCase(), at = ta.value.toLowerCase().indexOf(probe);
    if (at > 0) { ta.focus(); ta.setSelectionRange(at, at); ta.scrollTop = Math.max(0, ta.value.slice(0, at).split("\n").length - 3) * 18; }
  }
  $("#docsave").onclick = async () => {
    const r = await fetch(`/docs/${encodeURIComponent(name)}`, { method: "PUT", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ content: $("#doctext").value, base_version: d.version }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 409) { $("#dmsg").textContent = `Changed meanwhile (now v${j.version}). Copy your edit, reopen and apply it again.`; return; }
    if (!r.ok) { $("#dmsg").textContent = j.error || r.statusText; return; }
    openDocPart(name); loadDocs();
  };
}

async function loadReview() {
  const items = await api("/api/review");
  $("#reviewlist").innerHTML = items.length ? `<p class="meta">What could be cleaned up, biggest token savings first. Click an id to open it.</p>
    <table><tr><th>kind</th><th>memories</th><th>entity</th><th>~tokens</th><th>suggestion</th></tr>
    ${items.map(i => `<tr><td>${esc(i.kind)}</td><td>${i.ids.map(x => `<a href="#" data-id="${x}">m${x}</a>`).join(" ")}</td>
    <td>${esc(i.entity || "")}</td><td>${i.saving}</td><td>${esc(i.action)}<div class="meta">${esc(i.text)}</div></td></tr>`).join("")}</table>`
    : `<div class="empty">Nothing to clean up.</div>`;
  $("#reviewlist").onclick = e => { const a = e.target.closest("a[data-id]"); if (a) { e.preventDefault(); openMemory(+a.dataset.id); } };
}

async function loadStats() {
  const s = await api("/api/stats");
  $("#statsview").innerHTML = `<table>${Object.entries(s.stats).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join("")}</table>
    <h3>Tool calls, last 7 days</h3><table><tr><th>tool</th><th>calls</th><th>avg tokens</th><th>max</th><th>empty</th><th>avg ms</th></tr>
    ${s.usage.map(u => `<tr><td>${esc(u.tool)}</td><td>${u.calls}</td><td>${u.avg_tokens}</td><td>${u.max_tokens}</td><td>${u.empty}</td><td>${u.avg_ms}</td></tr>`).join("")}</table>`;
}

token ? start() : showGate();
</script>
</body>
</html>
