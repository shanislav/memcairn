# Example deployment. Put TLS in front (nginx/caddy) and keep it on a private network.
#   echo "MEMCAIRN_PUBLIC_URL=https://memory.example.com" > .env
#   mkdir -p data && sudo chown 10001 data
#   docker compose up -d
#   docker compose exec memcairn memcairn login-link     # web UI, then "Add machine"
# Update: back up (docker compose exec memcairn memcairn backup /data/pre-update.db), set
#   MEMCAIRN_VERSION=X.Y.Z in .env (releases: CHANGELOG.md), docker compose pull && docker compose up -d
services:
  memcairn:
    # A fixed release, not :latest: an update is a step you choose. Or build from a clone: `build: .`
    image: ghcr.io/shanislav/memcairn:${MEMCAIRN_VERSION:-0.2.0}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:  # set these in .env next to this file
      MEMCAIRN_PUBLIC_URL: ${MEMCAIRN_PUBLIC_URL:-http://localhost:8765}
      MEMCAIRN_OAUTH: ${MEMCAIRN_OAUTH:-0}          # 1: claude.ai and the Claude apps
      MEMCAIRN_EMBED_MODEL: ${MEMCAIRN_EMBED_MODEL:-minishlab/potion-multilingual-128M}  # none: basic search only
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8765:8765"
