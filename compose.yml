# Example deployment. Put TLS in front (nginx/caddy) and keep it on a private network.
#   docker compose up -d
#   docker compose exec memcairn memcairn login-link     # web UI, then "Add machine"
services:
  memcairn:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MEMCAIRN_PUBLIC_URL: ${MEMCAIRN_PUBLIC_URL:-http://localhost:8765}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8765:8765"
