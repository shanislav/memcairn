[project]
name = "memcairn"
version = "0.1.2"
description = "Self-hosted long-term memory for Claude Code and other MCP clients, shared by all your machines"
readme = "README.md"
license = "MIT"
authors = [{ name = "Roman Sedivy" }]
requires-python = ">=3.11"
keywords = ["mcp", "memory", "claude", "claude-code", "llm", "agents", "self-hosted", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "mcp>=1.20",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
vector = ["fastembed>=0.4", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.26"]  # tests use numpy with fake embedders

[project.urls]
Homepage = "https://github.com/shanislav/memcairn"
Documentation = "https://github.com/shanislav/memcairn/blob/main/docs/setup.md"
Changelog = "https://github.com/shanislav/memcairn/blob/main/CHANGELOG.md"
Issues = "https://github.com/shanislav/memcairn/issues"

[project.scripts]
memcairn = "memcairn.cli:app"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# explicit so a user-level ruff config can't change the result
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM"]
ignore = ["SIM905", "B905"]  # word lists read better as a split string; zip lengths are equal by construction

[tool.ruff.lint.per-file-ignores]
"src/memcairn/cli.py" = ["B008"]  # typer.Option in defaults is the typer idiom
